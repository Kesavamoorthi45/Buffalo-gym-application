databases:
  - name: buffalo-gym-db
    plan: free
    databaseName: buffalo_gym
    user: buffalo_gym

services:
  - type: web
    name: buffalo-gym-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py populate_home_data
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buffalo-gym-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
